# 공통 설정. 경로는 저장소 루트 기준 상대경로입니다.
project:
  name: seoul-apartment-ml
  version: 0.1.0

analysis_period:
  start: "2021-01-01"
  end: "2026-10-31"

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  sample_dir: data/sample
  # 아래 sample_* 파일은 합성(가짜) 테스트 데이터입니다. 실제 거래가 아닙니다.
  sample_transactions: data/sample/sample_transactions_TEST_ONLY.csv
  sample_base_rates: data/sample/sample_base_rates_TEST_ONLY.csv
  sample_regulations: data/sample/sample_regulations_TEST_ONLY.csv
  model_dir: models

split:
  # 계약일 기준 시간순 분할 비율 (합 = 1.0)
  train_ratio: 0.70
  valid_ratio: 0.15
  test_ratio: 0.15
  min_rows_per_split: 1

random_seed: 42

models:
  # scripts/train_price.py 가 저장하는 경로와 같아야 합니다 (예전 값은 price_model.joblib
  # 이었는데 스크립트는 price_regression.joblib 에 저장해서 API 가 모델을 못 찾았습니다).
  price_model_path: models/price_regression.joblib
  anomaly_model_path: models/anomaly_model.joblib
  # 자치구 -> 동 -> 단지 목록. GET /locations/{자치구} 가 이 파일을 내려줍니다.
  complex_directory_path: models/complex_directory.json

classification:
  # 레이블 기준을 확정해서 켰습니다. 기준은 label_anomalies(direction="below"):
  # 같은 자치구·평형대 기준가보다 1단계 20%, 2단계 30% 이상 **싼** 거래를 1 로 둡니다.
  # 비싼 쪽은 제외했습니다 - 직거래 비율이 전체 평균(2.74%)보다도 낮아서(1.36%)
  # '기준가에서 벗어났다' 외에 공통점이 보이지 않기 때문입니다. 자세한 비교는
  # docs/MODEL_PLAN.md 를 보세요.
  training_enabled: true
