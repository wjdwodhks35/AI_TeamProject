[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apartment-ml"
version = "0.1.0"
description = "서울 아파트 가격 예측 및 이상거래 의심 탐지 시스템 (Phase 0: 공통 개발 기반)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "fastapi>=0.115",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = [
    "E501",  # 줄 길이는 ruff format 이 관리 (한글 문자열/독스트링은 예외 허용)
    "N803",  # scikit-learn 관례: 입력 행렬 인자명 X
    "N806",  # scikit-learn 관례: 지역변수 X
    "N812",  # `from apartment_ml import schemas as S` 별칭 허용
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
